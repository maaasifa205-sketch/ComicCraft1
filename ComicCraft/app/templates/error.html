<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Error - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<div class="container">

    <section class="card error-page">

        <div class="tag">
            ERROR
        </div>

        <h1>
            Something went wrong
        </h1>

        <p>
            {{ message }}
        </p>

        <a
            class="button"
            href="/"
        >
            Go Back
        </a>

    </section>

</div>

</body>
</html>
